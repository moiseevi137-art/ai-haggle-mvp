meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  containerPort: 10000
  command: |
    (while true; do 
      echo "=== Запуск туннеля Pinggy ==="; 
      ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:10000 tcp@free.pinggy.online; 
      echo "=== Переподключение туннеля через 5 секунд... ==="; 
      sleep 5; 
    done) & 
    node index.js
