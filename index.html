<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Haggle: Торг</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 450px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; overflow: hidden; }
        .chat-header { background: #00AAFF; color: white; padding: 15px; font-weight: bold; text-align: center; font-size: 18px; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.4; }
        .user { background: #00AAFF; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #f0f2f5; color: #1c1e21; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #eee; background: #fff; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 15px; }
        .input-area button { background: #00AAFF; color: white; border: none; padding: 0 20px; margin-left: 8px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Переговорщик AI-Haggle</div>
    <div class="messages" id="chat-messages">
        <div class="msg bot">Привет! По поводу объявления. Какую цену предложите?</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Напишите вашу цену..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">➡️</button>
    </div>
</div>

<script>
    let currentWave = 1;
    const itemPrice = 5000; // Стартовая цена товара для теста
    const userId = "test-user-" + Math.random().toString(36).substring(7);

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${sender}`;
        msgDiv.innerText = text;
        const container = document.getElementById('chat-messages');
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        try {
            // Отправляем запрос на ваш работающий бэкенд Render
            const response = await fetch('/api/negotiate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, userMessage: text, currentWave, itemPrice })
            });
            
            const data = await response.json();
            appendMessage(data.text, 'bot');
            currentWave = data.nextWave; // Запоминаем текущую волну торга
        } catch (error) {
            console.error('Ошибка:', error);
            appendMessage('Ошибка связи с сервером AI.', 'bot');
        }
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>
</body>
</html>
